name: Figma Release Notes -> Feishu (Card)

on:
  workflow_dispatch:
    inputs:
      send_first_now:
        description: "Manual run: always send the latest (first) release note"
        required: false
        default: "true"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      RSS_URL: ${{ secrets.RSS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch latest release note and send to Feishu
        env:
          SEND_FIRST_NOW: ${{ github.event.inputs.send_first_now }}
        run: |
          python <<'PY'
          import os, json, hashlib, datetime, re
          import requests
          import feedparser

          FEISHU_WEBHOOK = os.environ.get("FEISHU_WEBHOOK", "").strip()
          if not FEISHU_WEBHOOK:
            raise SystemExit("Missing FEISHU_WEBHOOK secret.")

          RSS_URL = (os.environ.get("RSS_URL") or "https://www.figma.com/release-notes/feed/atom.xml").strip()
          send_first_now = (os.environ.get("SEND_FIRST_NOW") or "true").lower() == "true"

          state_file = "sent_state.json"
          sent = set()
          if os.path.exists(state_file):
            try:
              with open(state_file, "r", encoding="utf-8") as f:
                sent = set(json.load(f).get("sent_ids", []))
            except Exception:
              sent = set()

          headers = {
            "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36",
            "Accept": "application/atom+xml,application/xml;q=0.9,text/xml;q=0.8,*/*;q=0.7",
            "Accept-Language": "en-US,en;q=0.9",
            "Cache-Control": "no-cache",
            "Pragma": "no-cache",
          }

          # Fetch (requests auto-decompresses gzip)
          r = requests.get(RSS_URL, headers=headers, timeout=30, allow_redirects=True)
          r.raise_for_status()

          content = r.content  # bytes
          preview = content[:2000].decode("utf-8", errors="replace")

          # Guard: detect if secrets are swapped (calling Feishu instead of RSS)
          if re.search(r'"msg"\s*:\s*"params error, msg_type need"', preview):
            raise SystemExit("It looks like RSS_URL is pointing to Feishu webhook. Please swap RSS_URL and FEISHU_WEBHOOK secrets.")

          # Guard: detect HTML bot-check/login page
          if re.search(r"<html|<!doctype html", preview, re.IGNORECASE):
            raise SystemExit("Fetched HTML instead of Atom XML. The feed request may be blocked from GitHub Actions network.")

          feed = feedparser.parse(content)

          if not feed.entries:
            raise SystemExit("No entries found in feed after parsing bytes.")

          entry = feed.entries[0]  # latest
          title = (entry.get("title") or "").strip()
          link = (entry.get("link") or "").strip()
          published = (entry.get("published") or entry.get("updated") or "").strip()
          entry_id = (entry.get("id") or "").strip()

          # Summary: prefer summary, fallback to content
          summary = (
              entry.get("summary")
              or (entry.get("content", [{}])[0].get("value") if entry.get("content") else "")
              or ""
          )

          # Clean summary: strip HTML tags & compress whitespace
          summary = re.sub(r"<[^>]+>", "", summary)
          summary = re.sub(r"\s+", " ", summary).strip()

          if not title or not link:
            raise SystemExit("Parsed entry missing title or link.")

          stable_id_src = entry_id or (title + "|" + link)
          stable_id = hashlib.md5(stable_id_src.encode("utf-8")).hexdigest()

          already_sent = stable_id in sent
          should_send = send_first_now or (not already_sent)

          print("RSS_URL:", RSS_URL)
          print("send_first_now:", send_first_now)
          print("already_sent:", already_sent)
          print("should_send:", should_send)
          print("title:", title)
          print("link:", link)

          if not should_send:
            print("Nothing to send (already sent).")
            raise SystemExit(0)

          # Limit summary length for readability
          if len(summary) > 320:
            summary = summary[:320].rstrip() + "…"
          if not summary:
            summary = "_No summary available._"

          # --- Clean Feishu interactive card (no date) ---
          card = {
            "config": {
              "wide_screen_mode": True
            },
            "header": {
              "title": {
                "tag": "plain_text",
                "content": "🚀 Figma Release Notes"
              },
              "template": "blue"
            },
            "elements": [
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": f"**{title}**"
                }
              },
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": summary
                }
              },
              {
                "tag": "action",
                "actions": [
                  {
                    "tag": "button",
                    "text": {
                      "tag": "plain_text",
                      "content": "Learn more"
                    },
                    "type": "primary",
                    "url": link
                  }
                ]
              }
            ]
          }
          
          payload = {
            "msg_type": "interactive",
            "card": card
          }
          
          resp = requests.post(FEISHU_WEBHOOK, json=payload, timeout=15)

          print("Feishu HTTP status:", resp.status_code)
          print("Feishu body:", resp.text)

          if resp.status_code != 200:
            raise SystemExit(f"Feishu webhook HTTP {resp.status_code}")

          # Some bots return JSON like {"StatusCode":0,"StatusMessage":"success"}
          try:
            data = resp.json()
            if isinstance(data, dict) and ("StatusCode" in data) and data.get("StatusCode") != 0:
              raise SystemExit(f"Feishu rejected: {data}")
          except ValueError:
            pass

          # Save state
          sent.add(stable_id)
          with open(state_file, "w", encoding="utf-8") as f:
            json.dump(
              {"sent_ids": sorted(sent), "updated_at": datetime.datetime.utcnow().isoformat() + "Z"},
              f,
              ensure_ascii=False,
              indent=2
            )

          print("Sent OK, state updated.")
          PY

      - name: Commit state
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@github.com"
          git add sent_state.json || true
          git commit -m "Update sent state" || true
          git push || true
