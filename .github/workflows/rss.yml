name: RSS to Feishu

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    env:
      RSS_URL: ${{ secrets.RSS_URL }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS
        run: |
          echo "Fetching RSS..."
          curl -LfsS "$RSS_URL" -o feed.xml
          echo "RSS fetched, first 5 lines:"
          head -n 5 feed.xml

            - name: Parse and Send to Feishu
        run: |
          node <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const https = require('https');

          const xml = fs.readFileSync('feed.xml', 'utf8');

          function decode(s='') {
            return s
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'");
          }

          function pick(block, reList) {
            for (const re of reList) {
              const m = block.match(re);
              if (m && m[1]) return decode(m[1].trim());
            }
            return '';
          }

          // ---- Parse RSS (<item>) or Atom (<entry>) ----
          let entries = [...xml.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/g)].map(m => m[1]);
          let mode = 'rss';

          if (!entries.length) {
            entries = [...xml.matchAll(/<entry\b[^>]*>([\s\S]*?)<\/entry>/g)].map(m => m[1]);
            mode = 'atom';
          }

          if (!entries.length) {
            console.log('No <item> or <entry> found. Nothing to send.');
            process.exit(0);
          }

          const sentFile = 'sent.txt';
          const sent = fs.existsSync(sentFile)
            ? new Set(fs.readFileSync(sentFile, 'utf8').split('\n').filter(Boolean))
            : new Set();

          function postToFeishu(text) {
            return new Promise((resolve, reject) => {
              const payload = JSON.stringify({
                msg_type: "text",
                content: { text }
              });

              const req = https.request(process.env.FEISHU_WEBHOOK, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = "";
                res.on("data", (c) => data += c);
                res.on("end", () => resolve({ status: res.statusCode, body: data }));
              });

              req.on("error", reject);
              req.write(payload);
              req.end();
            });
          }

          (async () => {
            let sentCount = 0;

            for (const block of entries.slice(0, 5)) {
              let title = '';
              let link = '';
              let time = '';

              if (mode === 'rss') {
                title = pick(block, [
                  /<title><!\[CDATA\[(.*?)\]\]><\/title>/,
                  /<title>([\s\S]*?)<\/title>/
                ]);
                link = pick(block, [
                  /<link>([\s\S]*?)<\/link>/
                ]);
                time = pick(block, [
                  /<pubDate>([\s\S]*?)<\/pubDate>/,
                  /<dc:date>([\s\S]*?)<\/dc:date>/
                ]);
              } else {
                // Atom
                title = pick(block, [
                  /<title[^>]*><!\[CDATA\[(.*?)\]\]><\/title>/,
                  /<title[^>]*>([\s\S]*?)<\/title>/
                ]);

                // Atom link can be: <link href="..."/> or <link rel="alternate" href="..."/>
                const mHref = block.match(/<link\b[^>]*href="([^"]+)"[^>]*\/?>/);
                link = mHref ? decode(mHref[1].trim()) : '';

                time = pick(block, [
                  /<updated>([\s\S]*?)<\/updated>/,
                  /<published>([\s\S]*?)<\/published>/
                ]);
              }

              if (!title || !link) continue;

              const id = crypto.createHash('md5').update(title + link).digest('hex');
              if (sent.has(id)) continue;

              const msg = `🆕 RSS 更新\n${title}\n${link}${time ? `\n${time}` : ''}`;
              const r = await postToFeishu(msg);
              console.log("Feishu response:", r.status, r.body);

              sent.add(id);
              sentCount++;
            }

            fs.writeFileSync(sentFile, [...sent].join('\n'));
            console.log("Mode:", mode, "| New items sent:", sentCount);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF


      - name: Save state
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@github.com"
          git add sent.txt || true
          git commit -m "update sent items" || true
          git push || true
