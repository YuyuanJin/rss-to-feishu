name: RSS to Feishu

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    env:
      RSS_URL: ${{ secrets.RSS_URL }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS
        run: |
          echo "Fetching RSS..."
          curl -LfsS "$RSS_URL" -o feed.xml
          echo "RSS fetched, first 5 lines:"
          head -n 5 feed.xml

      - name: Parse and Send to Feishu
        run: |
          node <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const https = require('https');

          const xml = fs.readFileSync('feed.xml', 'utf8');

          // RSS: <item> ... </item>
          const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)];

          if (!items.length) {
            console.log("No <item> found. This feed might be Atom. (Still OK, but this script only handles RSS for now.)");
            process.exit(0);
          }

          const sentFile = 'sent.txt';
          const sent = fs.existsSync(sentFile)
            ? new Set(fs.readFileSync(sentFile, 'utf8').split('\n').filter(Boolean))
            : new Set();

          function postToFeishu(text) {
            return new Promise((resolve, reject) => {
              const payload = JSON.stringify({
                msg_type: "text",
                content: { text }
              });

              const req = https.request(process.env.FEISHU_WEBHOOK, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = "";
                res.on("data", (c) => data += c);
                res.on("end", () => resolve({ status: res.statusCode, body: data }));
              });

              req.on("error", reject);
              req.write(payload);
              req.end();
            });
          }

          (async () => {
            let sentCount = 0;

            for (const m of items.slice(0, 3)) {
              const block = m[1];
              const title =
                (block.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>/) || block.match(/<title>(.*?)<\/title>/))?.[1];
              const link = (block.match(/<link>(.*?)<\/link>/))?.[1];

              if (!title || !link) continue;

              const id = crypto.createHash('md5').update(title + link).digest('hex');
              if (sent.has(id)) continue;

              const msg = `🆕 RSS 更新\n${title}\n${link}`;
              const r = await postToFeishu(msg);
              console.log("Feishu response:", r.status, r.body);

              sent.add(id);
              sentCount++;
            }

            fs.writeFileSync(sentFile, [...sent].join('\n'));
            console.log("New items sent:", sentCount);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Save state
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@github.com"
          git add sent.txt || true
          git commit -m "update sent items" || true
          git push || true
