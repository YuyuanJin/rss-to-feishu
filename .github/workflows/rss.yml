name: Figma Atom to Feishu (Debug)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    env:
      RSS_URL: ${{ secrets.RSS_URL }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch feed (supports gzip) + preview
        run: |
          echo "RSS_URL set? -> ${RSS_URL:+YES}"
          echo "FEISHU_WEBHOOK set? -> ${FEISHU_WEBHOOK:+YES}"

          curl -LfsS --compressed \
            -H "Accept: application/atom+xml,application/xml;q=0.9,*/*;q=0.8" \
            -A "Mozilla/5.0" \
            "$RSS_URL" -o feed.xml

          echo "---- first 20 lines ----"
          sed -n '1,20p' feed.xml

      - name: Send a test message to Feishu (must appear)
        run: |
          node --input-type=commonjs <<'EOF'
          const https = require('https');

          function postToFeishu(text) {
            return new Promise((resolve, reject) => {
              const payload = JSON.stringify({ msg_type: "text", content: { text } });
              const req = https.request(process.env.FEISHU_WEBHOOK, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.write(payload);
              req.end();
            });
          }

          (async () => {
            const msg = `RSS Bot 测试消息 ✅\n如果你看到了这条，说明 webhook 没问题。\n时间：${new Date().toISOString()}`;
            const r = await postToFeishu(msg);
            console.log('Feishu response:', r.status, r.body);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Parse feed and send updates
        run: |
          node --input-type=commonjs <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const https = require('https');

          const xml = fs.readFileSync('feed.xml', 'utf8');

          function decode(s='') {
            return s
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'");
          }

          function pick(block, patterns) {
            for (const p of patterns) {
              const m = block.match(p);
              if (m && m[1]) return decode(m[1].trim());
            }
            return '';
          }

          function extractAtomLink(block) {
            const alt = block.match(/<link\b[^>]*rel="alternate"[^>]*href="([^"]+)"[^>]*\/?>/);
            if (alt && alt[1]) return decode(alt[1]);

            const any = block.match(/<link\b[^>]*href="([^"]+)"[^>]*\/?>/);
            if (any && any[1]) return decode(any[1]);

            const text = block.match(/<link[^>]*>([\s\S]*?)<\/link>/);
            if (text && text[1]) return decode(text[1].trim());

            return '';
          }

          function postToFeishu(text) {
            return new Promise((resolve, reject) => {
              const payload = JSON.stringify({ msg_type: "text", content: { text } });
              const req = https.request(process.env.FEISHU_WEBHOOK, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.write(payload);
              req.end();
            });
          }

          // RSS <item> or Atom <entry>
          let entries = [...xml.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/g)].map(m => m[1]);
          let mode = 'rss';

          if (!entries.length) {
            entries = [...xml.matchAll(/<entry\b[^>]*>([\s\S]*?)<\/entry>/g)].map(m => m[1]);
            mode = 'atom';
          }

          console.log('Mode:', mode, 'Entries found:', entries.length);

          if (!entries.length) {
            console.log('No <item> or <entry> found, nothing to send.');
            process.exit(0);
          }

          const sentFile = 'sent.txt';
          const sent = fs.existsSync(sentFile)
            ? new Set(fs.readFileSync(sentFile, 'utf8').split('\n').filter(Boolean))
            : new Set();

          let sentCount = 0;

          for (const [i, block] of entries.slice(0, 10).entries()) {
            let title = '';
            let link = '';
            let time = '';

            if (mode === 'rss') {
              title = pick(block, [
                /<title><!\[CDATA\[(.*?)\]\]><\/title>/,
                /<title>([\s\S]*?)<\/title>/
              ]);
              link = pick(block, [
                /<link>([\s\S]*?)<\/link>/
              ]);
              time = pick(block, [
                /<pubDate>([\s\S]*?)<\/pubDate>/,
                /<dc:date>([\s\S]*?)<\/dc:date>/
              ]);
            } else {
              title = pick(block, [
                /<title[^>]*><!\[CDATA\[(.*?)\]\]><\/title>/,
                /<title[^>]*>([\s\S]*?)<\/title>/
              ]);
              link = extractAtomLink(block);
              time = pick(block, [
                /<updated>([\s\S]*?)<\/updated>/,
                /<published>([\s\S]*?)<\/published>/
              ]);
            }

            console.log(`Item#${i+1} parsed -> title? ${!!title} | link? ${!!link}`);

            if (!title || !link) continue;

            const id = crypto.createHash('md5').update(title + link).digest('hex');
            if (sent.has(id)) continue;

            const msg =
              `RSS 🆕 更新\n${title}\n${link}` +
              (time ? `\n${time}` : '');

            const r = await postToFeishu(msg);
            console.log('Feishu response:', r.status, r.body);

            sent.add(id);
            sentCount++;
          }

          fs.writeFileSync(sentFile, [...sent].join('\n'));
          console.log('New items sent:', sentCount);
          EOF

      - name: Save sent state
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@github.com"
          git add sent.txt || true
          git commit -m "update sent items" || true
          git push || true
