name: RSS to Feishu

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟检查一次
  workflow_dispatch:        # 允许手动 Run

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    env:
      RSS_URL: ${{ secrets.RSS_URL }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS / Atom
        run: |
          echo "Fetching feed..."
          curl -LfsS "$RSS_URL" -o feed.xml
          echo "Feed fetched. Preview:"
          head -n 10 feed.xml

